<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="container" style="padding-top:20px;padding-bottom:40px;">
    <!-- Page Header with Back Button & Breadcrumbs -->
    <div class="bm-page-header-top" style="margin-bottom:18px;">
      <button type="button" class="bm-back-btn" onclick="window.nav.goBackOrFallback('/shop/shop.html')" aria-label="Go back to Shop">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back to Shop</span>
      </button>
      <nav class="bm-breadcrumbs" aria-label="Breadcrumb">
        <a href="/index.html" class="bm-breadcrumb-item">Home</a>
        <span class="bm-breadcrumb-sep">/</span>
        <a href="/shop/shop.html" class="bm-breadcrumb-item">Shop</a>
        <span class="bm-breadcrumb-sep">/</span>
        <span class="bm-breadcrumb-item active" aria-current="page">Shopping Cart</span>
      </nav>
    </div>

    <div class="page-head"><h1>Your Cart</h1></div>

    <div class="form-error" id="form-error" role="alert"></div>

    <div class="cart-layout" id="cart-layout">
      <p class="text-muted">Loading your cart…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/product-card.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>

  <script>
    if (!window.auth.isLoggedIn()) {
      window.location.href = '/auth/login.html';
    }

    const errorBox = document.getElementById('form-error');
    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }
    function hideError() { errorBox.classList.remove('visible'); }

    function renderCart(cart) {
      const layout = document.getElementById('cart-layout');

      if (cart.items.length === 0) {
        layout.innerHTML = `
          <div class="card empty-state" style="grid-column:1/-1;">
            Your cart is empty. <a href="/shop/shop.html" style="color:var(--color-primary);font-weight:600;">Browse products</a>
          </div>
        `;
        return;
      }

      const lines = cart.items.map((item) => {
        const image = window.shopHelpers.firstImage(item);
        return `
          <div class="cart-line" data-product-id="${item.product_id}">
            <div class="cart-line__thumb">
              ${image ? `<img src="${image}" style="width:100%;height:100%;object-fit:cover;" />` : ''}
            </div>
            <div>
              <div class="cart-line__title">${item.title}</div>
              <div class="text-muted" style="font-size:var(--font-size-xs);">${window.shopHelpers.formatINR(item.price)} each</div>
              ${item.product_status !== 'ACTIVE_SHOP' ? '<div style="color:var(--color-danger);font-size:var(--font-size-xs);font-weight:600;">No longer available</div>' : ''}
            </div>
            <div class="qty-stepper">
              <button type="button" data-action="dec">−</button>
              <input type="number" class="qty-value" value="${item.quantity}" min="1" max="${item.available_qty}" readonly />
              <button type="button" data-action="inc">+</button>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:700;">${window.shopHelpers.formatINR(item.price * item.quantity)}</div>
              <button class="cart-line__remove" data-action="remove">Remove</button>
            </div>
          </div>
        `;
      }).join('');

      layout.innerHTML = `
        <div class="card" style="padding:20px;">${lines}</div>
        <div class="card" style="padding:24px;height:fit-content;">
          <h3 style="margin-bottom:16px;">Order Summary</h3>
          <div class="summary-row"><span>Items (${cart.itemCount})</span><span>${window.shopHelpers.formatINR(cart.subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>Free</span></div>
          <div class="summary-row total"><span>Total</span><span>${window.shopHelpers.formatINR(cart.subtotal)}</span></div>
          <a href="/shop/checkout.html" class="btn btn-primary" style="width:100%;margin-top:16px;">Proceed to Checkout</a>
        </div>
      `;

      wireLineActions();
    }

    function wireLineActions() {
      document.querySelectorAll('.cart-line').forEach((line) => {
        const productId = line.dataset.productId;
        const input = line.querySelector('.qty-value');

        line.querySelector('[data-action="inc"]').addEventListener('click', async () => {
          const next = Math.min(Number(input.max), Number(input.value) + 1);
          await updateQty(productId, next);
        });
        line.querySelector('[data-action="dec"]').addEventListener('click', async () => {
          const next = Math.max(1, Number(input.value) - 1);
          await updateQty(productId, next);
        });
        line.querySelector('[data-action="remove"]').addEventListener('click', async () => {
          hideError();
          try {
            const cart = await window.api.delete(`/cart/${productId}`);
            renderCart(cart);
          } catch (err) {
            showError(err.message);
          }
        });
      });
    }

    async function updateQty(productId, quantity) {
      hideError();
      try {
        const cart = await window.api.patch(`/cart/${productId}`, { quantity });
        renderCart(cart);
      } catch (err) {
        showError(err.message);
      }
    }

    (async () => {
      try {
        const cart = await window.api.get('/cart');
        renderCart(cart);
      } catch (err) {
        document.getElementById('cart-layout').innerHTML = `<p class="text-muted">Could not load your cart: ${err.message}</p>`;
      }
    })();
  </script>

</body>
</html>
