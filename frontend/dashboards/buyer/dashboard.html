<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buyer Dashboard — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="dashboard-shell">
    <div class="container">
      <div class="bm-page-header-wrap" style="margin-bottom: 20px;">
        <div class="bm-breadcrumbs" style="margin-bottom: 8px;">
          <a href="/index.html" class="bm-breadcrumb-item">BidMart</a>
          <span class="bm-breadcrumb-sep">/</span>
          <span class="bm-breadcrumb-item active">Buyer Dashboard</span>
        </div>
        <div>
          <a href="/index.html" class="bm-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/index.html'); return false;" aria-label="Go back to marketplace home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back to Marketplace</span>
          </a>
        </div>
      </div>

      <div class="card dashboard-welcome" id="welcome-card">
        <span class="badge badge-mint">BUYER</span>
        <h1 id="welcome-heading">Loading your profile…</h1>
        <div style="margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;">
          <a href="/shop/shop.html" class="btn btn-primary">Continue Shopping</a>
          <a href="/auction/auctions.html" class="btn btn-ghost">Browse Auctions</a>
          <a href="/notifications.html" class="btn btn-ghost">Notifications</a>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid">
        <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Total Orders</div></div>
        <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Active Bids</div></div>
        <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Won Auctions</div></div>
        <div class="stat-card"><div class="stat-value">—</div><div class="stat-label">Wishlist Items</div></div>
      </div>

      <div class="two-col">
        <div>
          <h3 class="dash-section-title">Recent Orders</h3>
          <div class="card" style="padding:20px;">
            <div id="recent-orders"><p class="text-muted">Loading…</p></div>
            <a href="/shop/orders.html" style="font-size:var(--font-size-sm);color:var(--color-primary);display:inline-block;margin-top:12px;">View all orders →</a>
          </div>
        </div>
        <div>
          <h3 class="dash-section-title">Active Auctions You're Winning</h3>
          <div class="card" style="padding:20px;">
            <div id="active-auctions"><p class="text-muted">Loading…</p></div>
            <a href="/dashboards/buyer/bids.html" style="font-size:var(--font-size-sm);color:var(--color-primary);display:inline-block;margin-top:12px;">View all bids →</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>

  <script>
    window.auth.requireRole('BUYER');

    function statusLabel(status) {
      return status.replaceAll('_', ' ').replace(/\w\S*/g, (w) => w.charAt(0) + w.slice(1).toLowerCase());
    }

    function renderStats(stats) {
      const cards = [
        { value: stats.totalOrders, label: 'Total Orders' },
        { value: stats.activeBids, label: 'Active Bids' },
        { value: stats.wonAuctions, label: 'Won Auctions' },
        { value: stats.wishlistItems, label: 'Wishlist Items' },
        { value: stats.pendingReviews, label: 'Pending Reviews' },
        { value: stats.activeReturns, label: 'Active Returns' },
      ];
      document.getElementById('stat-grid').innerHTML = cards.map((c) => `
        <div class="stat-card"><div class="stat-value">${c.value}</div><div class="stat-label">${c.label}</div></div>
      `).join('');
    }

    function renderRecentOrders(orders) {
      const container = document.getElementById('recent-orders');
      container.innerHTML = orders.length
        ? orders.map((o) => `
            <div class="cart-line" style="grid-template-columns:1fr auto;padding:10px 0;">
              <div>
                <a href="/shop/order-detail.html?id=${o.id}">Order #${o.id}</a>
                <span class="text-muted" style="font-size:var(--font-size-xs);"> · ${new Date(o.placed_at).toLocaleDateString()}</span>
              </div>
              <div style="text-align:right;">
                <div>₹${Number(o.total).toLocaleString('en-IN')}</div>
                <span class="status-pill status-${o.status.toLowerCase()}">${statusLabel(o.status)}</span>
              </div>
            </div>
          `).join('')
        : '<p class="text-muted">No orders yet.</p>';
    }

    function renderActiveAuctions(rows) {
      const container = document.getElementById('active-auctions');
      container.innerHTML = rows.length
        ? rows.map((row) => `
            <div class="cart-line" style="grid-template-columns:1fr auto;padding:10px 0;">
              <div>
                <a href="/auction/auction-detail.html?id=${row.auction_id}">${row.title}</a>
                <span class="text-muted" style="font-size:var(--font-size-xs);"> · ends ${new Date(row.ends_at).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}</span>
              </div>
              <div style="text-align:right;">
                <div>₹${Number(row.my_bid).toLocaleString('en-IN')}</div>
                <span class="status-pill status-active_shop">Highest bidder</span>
              </div>
            </div>
          `).join('')
        : '<p class="text-muted">You\'re not currently winning any auctions.</p>';
    }

    (async () => {
      try {
        const me = await window.auth.refreshProfile();
        document.getElementById('welcome-heading').textContent = `Welcome back, ${me.name.split(' ')[0]}!`;
      } catch (err) {
        document.getElementById('welcome-heading').textContent = 'Could not load your profile.';
      }

      try {
        const { stats, recentOrders, activeAuctions } = await window.api.get('/dashboard/buyer');
        renderStats(stats);
        renderRecentOrders(recentOrders);
        renderActiveAuctions(activeAuctions);
      } catch (err) {
        document.getElementById('recent-orders').innerHTML = `<p class="text-muted">Could not load dashboard: ${err.message}</p>`;
      }
    })();
  </script>

</body>
</html>
