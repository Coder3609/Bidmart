<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Auction Room — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/auth-modal.css" />
</head>
<body class="sc-app-body auc-app-body" style="background-color:var(--sc-bg);margin:0;">

  <!-- Global Header -->
  <div id="seller-header"></div>

  <div class="sc-app">
    <!-- Persistent Left Navigation Sidebar -->
    <div id="auction-sidebar"></div>

    <!-- Main Content Area -->
    <main class="sc-main-content">
      
      <div class="bm-page-header-wrap" style="margin-bottom: 20px;">
        <div class="bm-breadcrumbs" style="margin-bottom: 8px;">
          <a href="/index.html" class="bm-breadcrumb-item">Auction Center</a>
          <span class="bm-breadcrumb-sep">/</span>
          <a href="/auction/auctions.html" class="bm-breadcrumb-item">Auctions</a>
          <span class="bm-breadcrumb-sep">/</span>
          <span class="bm-breadcrumb-item active" id="bc-title">Auction Room</span>
        </div>
        <div>
          <a href="/auction/auctions.html" class="bm-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/auction/auctions.html'); return false;" aria-label="Go back to live auctions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back to Auctions</span>
          </a>
        </div>
      </div>

      <!-- Top Breadcrumb Header -->
      <div class="sc-page-header">
        <div>
          <h1 class="sc-title" id="page-auction-title">Live Auction Room</h1>
        </div>
      </div>

      <div class="form-error" id="form-error" role="alert" style="margin-bottom:16px;"></div>

      <!-- Detail Root -->
      <div id="auction-root">
        <p class="text-muted" style="text-align:center;padding:50px;">Loading live auction data…</p>
      </div>

    </main>
  </div>

  <!-- Complete-order modal (shown to the winner once the auction has closed) -->
  <div class="bm-modal-overlay" id="pay-modal">
    <div class="bm-modal">
      <div class="bm-modal-header">
        <h3 class="bm-modal-title">Complete Your Auction Win</h3>
        <button type="button" class="bm-modal-close" id="pay-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="bm-modal-body">
        <p class="text-muted" style="font-size:0.85rem;margin-top:0;margin-bottom:16px;">
          Choose a delivery address and payment method to finish claiming your win.
        </p>

        <form id="pay-order-form">
          <div class="form-group" style="margin-bottom:14px;">
            <label for="pay-address" style="display:block;font-weight:700;font-size:0.85rem;margin-bottom:6px;">Delivery address</label>
            <select id="pay-address" class="auc-filter-select" style="width:100%;" required></select>
          </div>

          <details style="margin-bottom:16px;">
            <summary style="cursor:pointer;font-weight:700;font-size:0.82rem;color:var(--auc-primary);">+ Add a new delivery address</summary>
            <div id="pay-address-form" style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">
              <input id="pa-fullName" placeholder="Full name *" class="auc-quickbid-input" style="height:36px;" />
              <input id="pa-phone" placeholder="Phone *" class="auc-quickbid-input" style="height:36px;" />
              <input id="pa-line1" placeholder="Address line *" class="auc-quickbid-input" style="height:36px;" />
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <input id="pa-city" placeholder="City *" class="auc-quickbid-input" style="height:36px;" />
                <input id="pa-state" placeholder="State *" class="auc-quickbid-input" style="height:36px;" />
              </div>
              <input id="pa-postalCode" placeholder="Postal code *" class="auc-quickbid-input" style="height:36px;" />
              <button type="button" class="sc-btn-primary" id="btn-save-pay-addr" style="height:34px;font-size:0.8rem;justify-content:center;">Save Address</button>
            </div>
          </details>

          <div class="form-group" style="margin-bottom:20px;">
            <label for="pay-method" style="display:block;font-weight:700;font-size:0.85rem;margin-bottom:6px;">Payment method</label>
            <select id="pay-method" class="auc-filter-select" style="width:100%;">
              <option value="WALLET">BidMart Escrow Wallet (Direct Release)</option>
              <option value="COD">Cash on Delivery</option>
              <option value="CARD">Credit / Debit Card</option>
              <option value="UPI">UPI Payment</option>
            </select>
          </div>

          <button type="submit" class="sc-btn-mint" id="pay-submit" style="width:100%;height:44px;font-size:0.95rem;justify-content:center;">
            Confirm Order & Claim Item
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="bm-toast-container" id="toast-container"></div>

  <!-- Shared Scripts -->
  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/auth-modal.js"></script>
  <script src="/shared/auction-card.js"></script>
  <script src="/shared/seller-header.js"></script>
  <script src="/shared/auction-sidebar.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const auctionId = params.get('id');
    const productId = params.get('productId');
    const root = document.getElementById('auction-root');
    let pollTimer = null;
    let countdownTimer = null;
    let currentAuction = null;
    let userWallet = { total_balance: 0, available_balance: 0, reserved_balance: 0 };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `bm-toast ${type}`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✓' : (type === 'error' ? '✘' : 'ℹ')}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    async function fetchAuction() {
      if (auctionId) return window.api.get(`/auctions/${auctionId}`);
      if (productId) return window.api.get(`/auctions/by-product/${productId}`);
      throw new window.api.ApiError('No auction specified.', 400, 'MISSING_ID');
    }

    async function loadAuction({ isPoll = false } = {}) {
      try {
        const auction = await fetchAuction();
        currentAuction = auction;
        document.title = `${auction.title} — BidMart Live Auction`;
        document.getElementById('bc-title').textContent = auction.title;
        document.getElementById('page-auction-title').textContent = auction.title;
        
        if (!isPoll) {
          await loadUserWallet();
          render(auction);
        } else {
          updateLiveValues(auction);
        }
      } catch (err) {
        if (!isPoll) root.innerHTML = `<p class="text-muted" style="padding:40px;text-align:center;">${err.message}</p>`;
      }
    }

    async function loadUserWallet() {
      if (window.auth.isLoggedIn()) {
        try {
          userWallet = await window.api.get('/wallet');
        } catch (e) {}
      }
    }

    function render(auction) {
      const images = Array.isArray(auction.images) ? auction.images : [];
      const image = images.length > 0 ? images[0] : null;
      const me = window.auth.getUser();
      const isSeller = me && me.id === auction.seller_id;
      const isBuyer = me && me.role === 'BUYER';
      const label = window.auctionHelpers.auctionStatusLabel(auction);
      const isLive = auction.status === 'OPEN';
      const currentPrice = Number(auction.current_price);
      const minNextBid = Number(auction.minNextBid || currentPrice + Number(auction.bid_increment || 100));
      const increment = Number(auction.bid_increment || 100);

      let resultBanner = '';
      if (auction.status === 'CLOSED') {
        if (auction.winning_bid_id && auction.myBid && auction.myBid.status === 'WON') {
          resultBanner = `
            <div style="background:#ECFDF5;border:1px solid #A7F3D0;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
              <div>
                <strong style="color:#065F46;font-size:1.05rem;display:block;">🎉 Congratulations! You won this auction!</strong>
                <span style="color:#047857;font-size:0.85rem;">Winning bid: ₹${Number(auction.myBid.amount).toLocaleString('en-IN')}. Please complete delivery checkout to claim your item.</span>
              </div>
              <button type="button" class="sc-btn-mint" id="btn-open-claim-modal" style="cursor:pointer;padding:10px 20px;">Complete Delivery Checkout</button>
            </div>
          `;
        } else if (auction.winning_bid_id) {
          resultBanner = `
            <div style="background:#F1F5F9;border:1px solid #CBD5E1;border-radius:12px;padding:16px 20px;margin-bottom:20px;">
              <strong style="color:#0F172A;font-size:1rem;display:block;">Auction Ended & Sold</strong>
              <span class="text-muted" style="font-size:0.85rem;">Winning final bid: ₹${Number(auction.current_price).toLocaleString('en-IN')}.</span>
            </div>
          `;
        } else {
          resultBanner = `
            <div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:16px 20px;margin-bottom:20px;">
              <strong style="color:#B45309;font-size:1rem;display:block;">Auction Ended (Unsold)</strong>
              <span style="color:#92400E;font-size:0.85rem;">This auction closed without meeting the reserve price.</span>
            </div>
          `;
        }
      }

      // Live Bidding Box Markup
      let biddingBox = '';
      if (isLive) {
        if (!me) {
          biddingBox = `
            <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px;box-shadow:var(--auc-shadow);margin-bottom:20px;">
              <div style="font-size:0.85rem;color:#64748B;font-weight:600;margin-bottom:6px;">Current Leading Price</div>
              <div style="font-size:2rem;font-weight:800;color:#106EBE;margin-bottom:14px;">₹${currentPrice.toLocaleString('en-IN')}</div>
              <button type="button" onclick="if(window.buyerAuth){window.buyerAuth.open('login',{message:'Sign in to place bids on this auction.',onSuccess:()=>window.location.reload()});}else{window.location.href='/auth/login.html';}" class="sc-btn-primary" style="display:flex;justify-content:center;text-decoration:none;padding:12px 0;font-size:0.95rem;width:100%;border:none;cursor:pointer;">
                Log In to Place Bids
              </button>
            </div>
          `;
        } else if (isSeller) {
          biddingBox = `
            <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px;box-shadow:var(--auc-shadow);margin-bottom:20px;">
              <div style="font-size:0.85rem;color:#64748B;font-weight:600;margin-bottom:6px;">Current Leading Price</div>
              <div style="font-size:2rem;font-weight:800;color:#106EBE;margin-bottom:8px;">₹${currentPrice.toLocaleString('en-IN')}</div>
              <p class="text-muted" style="margin:0;font-size:0.85rem;">You are the seller of this auction. Live bidding activity appears below.</p>
            </div>
          `;
        } else if (!isBuyer) {
          biddingBox = `
            <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px;box-shadow:var(--auc-shadow);margin-bottom:20px;">
              <p class="text-muted" style="margin:0;">Only verified Buyer accounts can place bids.</p>
            </div>
          `;
        } else {
          const isWinning = auction.myBid && auction.myBid.status === 'WINNING';
          const isOutbid = auction.myBid && auction.myBid.status === 'OUTBID';
          const hasEnough = userWallet.available_balance >= minNextBid;

          biddingBox = `
            <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px;box-shadow:var(--auc-shadow);margin-bottom:20px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div>
                  <span style="font-size:0.75rem;color:#64748B;font-weight:700;text-transform:uppercase;">Current Price</span>
                  <div style="font-size:2rem;font-weight:800;color:var(--auc-primary);" id="detail-current-price">₹${currentPrice.toLocaleString('en-IN')}</div>
                </div>
                <div style="text-align:right;">
                  <span style="font-size:0.75rem;color:#64748B;font-weight:700;text-transform:uppercase;">Min Next Bid</span>
                  <div style="font-size:1.15rem;font-weight:800;color:#0F172A;" id="detail-min-next">₹${minNextBid.toLocaleString('en-IN')}</div>
                </div>
              </div>

              ${auction.myBid ? `
                <div class="auc-user-bid-pill ${isWinning ? 'winning' : 'outbid'}" style="margin-bottom:16px;">
                  <span>Your Bid: <strong>₹${Number(auction.myBid.amount).toLocaleString('en-IN')}</strong></span>
                  <span>${isWinning ? '✓ You are highest bidder' : '⚠️ You have been outbid'}</span>
                </div>
              ` : ''}

              <!-- Wallet Balance status in console -->
              <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">
                <div>
                  <span style="font-size:0.72rem;color:#64748B;font-weight:700;">AVAILABLE WALLET BALANCE</span>
                  <div style="font-size:0.95rem;font-weight:800;color:${hasEnough ? '#059669' : '#DC2626'};">
                    ₹${Number(userWallet.available_balance || 0).toLocaleString('en-IN')}
                  </div>
                </div>
                <a href="/wallet/index.html" class="sc-status-btn" style="padding:4px 10px;font-size:0.75rem;background:rgba(16,110,190,0.1);color:var(--auc-primary);border-radius:6px;text-decoration:none;font-weight:700;">
                  + Add Funds
                </a>
              </div>

              <!-- Quick Increment Chips -->
              <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
                <button type="button" class="sc-chip-btn" data-add="${increment}" style="padding:6px 12px;border:1px solid #CBD5E1;background:#F8FAFC;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">+₹${increment}</button>
                <button type="button" class="sc-chip-btn" data-add="500" style="padding:6px 12px;border:1px solid #CBD5E1;background:#F8FAFC;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">+₹500</button>
                <button type="button" class="sc-chip-btn" data-add="1000" style="padding:6px 12px;border:1px solid #CBD5E1;background:#F8FAFC;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">+₹1,000</button>
                <button type="button" class="sc-chip-btn" data-add="5000" style="padding:6px 12px;border:1px solid #CBD5E1;background:#F8FAFC;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">+₹5,000</button>
              </div>

              <!-- Bid Input Form -->
              <form id="detail-bid-form" style="display:flex;gap:10px;">
                <div class="auc-quickbid-input-wrap">
                  <span>₹</span>
                  <input type="number" 
                         id="detail-bid-amount" 
                         value="${minNextBid}" 
                         min="${minNextBid}" 
                         step="${increment}" 
                         required 
                         class="auc-quickbid-input" 
                         style="height:44px;font-size:1.1rem;padding-left:26px;" />
                </div>
                <button type="submit" class="sc-btn-primary" id="btn-submit-detail-bid" style="height:44px;padding:0 24px;font-size:0.95rem;cursor:pointer;">
                  Place Live Bid
                </button>
              </form>
            </div>
          `;
        }
      }

      root.innerHTML = `
        ${resultBanner}

        <div style="display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:start;">
          
          <!-- Left: Image Gallery & Product Specs -->
          <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;padding:24px;box-shadow:var(--auc-shadow);">
            <div style="width:100%;height:380px;border-radius:12px;background:#F1F5F9;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">
              ${image
                ? `<img src="${image}" alt="${auction.title}" style="width:100%;height:100%;object-fit:cover;" id="main-product-img" />`
                : `<div style="color:#94A3B8;font-size:3rem;">🏷️</div>`
              }
            </div>

            <!-- Thumbnail Selector if multiple -->
            ${images.length > 1 ? `
              <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;">
                ${images.map((img, i) => `
                  <img src="${img}" style="width:64px;height:64px;border-radius:8px;object-fit:cover;cursor:pointer;border:2px solid ${i === 0 ? 'var(--auc-primary)' : 'transparent'};" onclick="document.getElementById('main-product-img').src='${img}'" />
                `).join('')}
              </div>
            ` : ''}

            <!-- Seller & Product Meta -->
            <div style="border-top:1px solid #F1F5F9;padding-top:16px;">
              <h4 style="margin:0 0 10px;font-size:0.95rem;color:#0F172A;">Seller & Authenticity</h4>
              <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;">
                <span class="text-muted">Verified Seller:</span>
                <strong style="color:#0F172A;">${auction.seller_name}</strong>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;margin-top:6px;">
                <span class="text-muted">Item Condition:</span>
                <strong style="color:#0F172A;">${auction.condition || 'Brand New'}</strong>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;margin-top:6px;">
                <span class="text-muted">Category:</span>
                <strong style="color:#0F172A;">${auction.category_name}</strong>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;margin-top:6px;">
                <span class="text-muted">Auction ID:</span>
                <strong style="font-family:monospace;color:#64748B;">#AUC-${auction.id}</strong>
              </div>
            </div>

            <div style="border-top:1px solid #F1F5F9;padding-top:16px;margin-top:16px;">
              <h4 style="margin:0 0 8px;font-size:0.95rem;color:#0F172A;">Product Description</h4>
              <p class="text-muted" style="margin:0;font-size:0.85rem;line-height:1.5;">
                ${auction.description || 'No description provided by the seller.'}
              </p>
            </div>
          </div>

          <!-- Right: Live Timer, Bidding Console & Bid History -->
          <div>
            
            <!-- Live Status & Countdown Banner -->
            <div style="background:#0B1E36;color:#FFFFFF;border-radius:14px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
              <div>
                <span style="display:inline-block;padding:3px 8px;border-radius:12px;background:rgba(0,230,184,0.2);color:#00E6B8;font-size:0.75rem;font-weight:800;letter-spacing:0.04em;margin-bottom:4px;">
                  ${label} AUCTION
                </span>
                <div style="font-size:1.35rem;font-weight:800;color:#FFFFFF;" id="live-countdown-text">
                  Calculating…
                </div>
              </div>

              <div style="text-align:right;">
                <div style="font-size:0.75rem;color:#94A3B8;font-weight:600;">AUCTION ENDS</div>
                <div style="font-size:0.85rem;color:#FFFFFF;font-weight:700;">
                  ${new Date(auction.ends_at).toLocaleString('en-IN', { dateStyle:'short', timeStyle:'short' })}
                </div>
              </div>
            </div>

            <!-- Bidding Console -->
            ${biddingBox}

            <!-- Live Bid History Feed -->
            <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;padding:20px;box-shadow:var(--auc-shadow);">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;border-bottom:1px solid #F1F5F9;padding-bottom:10px;">
                <h3 style="margin:0;font-size:1rem;font-weight:800;color:#0F172A;display:flex;align-items:center;gap:8px;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="color:var(--auc-primary);"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2"/></svg>
                  <span>Live Bid History</span>
                </h3>
                <span class="text-muted" style="font-size:0.8rem;font-weight:700;" id="bid-history-count">Loading…</span>
              </div>

              <div style="max-height:300px;overflow-y:auto;" id="bid-history-container">
                <p class="text-muted" style="text-align:center;padding:20px;">Fetching bids…</p>
              </div>
            </div>

          </div>

        </div>
      `;

      wireBiddingForm(auction);
      loadBidHistory(auction.id);
      startLiveCountdown(auction);

      document.getElementById('btn-open-claim-modal')?.addEventListener('click', () => {
        loadAddresses();
        document.getElementById('pay-modal').classList.add('open');
      });
    }

    function wireBiddingForm(auction) {
      // Preset Chip additions
      document.querySelectorAll('.sc-chip-btn[data-add]').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById('detail-bid-amount');
          if (!input) return;
          const add = Number(btn.dataset.add);
          input.value = Number(input.value) + add;
        });
      });

      // Submit Bid
      document.getElementById('detail-bid-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        // 1. Guard for guest visitors: prompt modal and resume action
        const user = window.auth ? window.auth.getUser() : null;
        if (!user) {
          if (window.buyerAuth) {
            window.buyerAuth.requireBuyerAuth(async () => {
              await loadAuction();
            }, 'Sign in to your BidMart bidder account to place live bids.');
          } else {
            showToast('Please log in with a bidder account to place bids.', 'error');
          }
          return;
        }

        const amount = Number(document.getElementById('detail-bid-amount').value);
        const submitBtn = document.getElementById('btn-submit-detail-bid');

        if (userWallet.available_balance < amount) {
          showToast(`Insufficient balance (₹${userWallet.available_balance.toLocaleString('en-IN')}). Please deposit funds.`, 'error');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Placing Bid…';
          await window.api.post(`/auctions/${auction.id}/bids`, { amount });
          showToast(`Bid placed for ₹${amount.toLocaleString('en-IN')}!`, 'success');
          await loadAuction();
          renderAuctionSidebar();
        } catch (err) {
          if (err.code === 'KYC_REQUIRED' || err.code === 'KYC_PENDING' || err.code === 'KYC_REJECTED') {
            showToast(`${err.message} Opening KYC verification…`, 'error');
            setTimeout(() => {
              window.location.href = '/auction/kyc.html';
            }, 1400);
          } else {
            showToast(err.message || 'Bid failed.', 'error');
          }
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Place Live Bid';
        }
      });
    }

    async function loadBidHistory(id) {
      const container = document.getElementById('bid-history-container');
      const countEl = document.getElementById('bid-history-count');
      if (!container) return;

      try {
        const bids = await window.api.get(`/auctions/${id}/bids`);
        countEl.textContent = `${bids.length} bid${bids.length === 1 ? '' : 's'}`;

        if (bids.length === 0) {
          container.innerHTML = `<p class="text-muted" style="text-align:center;padding:24px;">No bids placed yet. Be the first to bid!</p>`;
          return;
        }

        container.innerHTML = bids.map((b, i) => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #F8FAFC;background:${i === 0 ? '#F0F9FF' : 'transparent'};border-radius:8px;margin-bottom:4px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="width:24px;height:24px;border-radius:50%;background:${i === 0 ? '#106EBE' : '#E2E8F0'};color:${i === 0 ? '#FFF' : '#64748B'};font-size:0.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;">
                ${i === 0 ? '👑' : `#${bids.length - i}`}
              </span>
              <div>
                <strong style="font-size:0.85rem;color:#0F172A;">${b.bidder_name || 'Buyer'}</strong>
                <span class="text-muted" style="font-size:0.72rem;display:block;">${new Date(b.created_at).toLocaleString('en-IN', { timeStyle:'medium', dateStyle:'short' })}</span>
              </div>
            </div>
            <div style="text-align:right;">
              <strong style="font-size:0.95rem;color:${i === 0 ? '#106EBE' : '#0F172A'};">₹${Number(b.amount).toLocaleString('en-IN')}</strong>
              ${i === 0 ? `<span style="font-size:0.7rem;color:#059669;font-weight:700;display:block;">Leading Bid</span>` : ''}
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<p class="text-muted" style="text-align:center;padding:16px;">Could not load history.</p>`;
      }
    }

    function updateLiveValues(auction) {
      const priceEl = document.getElementById('detail-current-price');
      const minNextEl = document.getElementById('detail-min-next');
      if (priceEl) priceEl.textContent = `₹${Number(auction.current_price).toLocaleString('en-IN')}`;
      if (minNextEl && auction.minNextBid) minNextEl.textContent = `₹${Number(auction.minNextBid).toLocaleString('en-IN')}`;
      loadBidHistory(auction.id);
    }

    function startLiveCountdown(auction) {
      if (countdownTimer) clearInterval(countdownTimer);
      const target = auction.status === 'SCHEDULED' ? auction.starts_at : auction.ends_at;

      function tick() {
        const el = document.getElementById('live-countdown-text');
        if (!el) return;
        const info = window.auctionHelpers.getCountdownInfo(auction);
        el.textContent = info.text;
      }

      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    // Claim Address Management
    async function loadAddresses() {
      const sel = document.getElementById('pay-address');
      try {
        const { items } = await window.api.get('/addresses');
        if (!items || items.length === 0) {
          sel.innerHTML = '<option value="">No addresses found — add one below</option>';
          return;
        }
        sel.innerHTML = items.map(a => `
          <option value="${a.id}" ${a.is_default ? 'selected' : ''}>
            ${a.full_name}, ${a.address_line_1}, ${a.city} (${a.postal_code})
          </option>
        `).join('');
      } catch (err) {
        sel.innerHTML = '<option value="">Could not load addresses</option>';
      }
    }

    document.getElementById('btn-save-pay-addr')?.addEventListener('click', async () => {
      const payload = {
        fullName: document.getElementById('pa-fullName').value.trim(),
        phone: document.getElementById('pa-phone').value.trim(),
        addressLine1: document.getElementById('pa-line1').value.trim(),
        city: document.getElementById('pa-city').value.trim(),
        state: document.getElementById('pa-state').value.trim(),
        postalCode: document.getElementById('pa-postalCode').value.trim(),
        isDefault: true,
      };

      if (!payload.fullName || !payload.phone || !payload.addressLine1 || !payload.city || !payload.postalCode) {
        showToast('Please fill all required address fields.', 'error');
        return;
      }

      try {
        await window.api.post('/addresses', payload);
        showToast('Address saved!', 'success');
        await loadAddresses();
      } catch (err) {
        showToast(err.message || 'Could not save address.', 'error');
      }
    });

    document.getElementById('pay-order-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const addressId = Number(document.getElementById('pay-address').value);
      const paymentMethod = document.getElementById('pay-method').value;
      const submitBtn = document.getElementById('pay-submit');

      if (!addressId) {
        showToast('Please select an address.', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing Order…';
        await window.api.post(`/auctions/${currentAuction.id}/complete-order`, { addressId, paymentMethod });
        showToast('Order confirmed! Redirecting to orders…', 'success');
        document.getElementById('pay-modal').classList.remove('open');
        setTimeout(() => window.location.href = '/shop/orders.html', 1200);
      } catch (err) {
        showToast(err.message || 'Order failed.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm Order & Claim Item';
      }
    });

    document.getElementById('pay-modal-close')?.addEventListener('click', () => {
      document.getElementById('pay-modal').classList.remove('open');
    });

    // Initial Bootstrap
    renderSellerHeader();
    renderAuctionSidebar();
    loadAuction();

    // Auto-poll live auction every 4 seconds
    pollTimer = setInterval(() => {
      if (currentAuction && currentAuction.status === 'OPEN') {
        loadAuction({ isPoll: true });
      }
    }, 4000);
  </script>

</body>
</html>
