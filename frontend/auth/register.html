<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
      <link rel="stylesheet" href="/shared/explore-dialog.css" />
  <link rel="stylesheet" href="/shared/global-dark.css" />
  <link rel="stylesheet" href="/shared/navbar-obsidian.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="auth-page">
    <div class="card auth-card">
      <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(16,110,190,0.1);color:#106EBE;font-weight:700;font-size:0.75rem;text-transform:uppercase;margin-bottom:12px;">
        <span>🛍️</span> <span>Buyer &amp; Bidder Registration</span>
      </div>

      <h1>Create your account</h1>
      <p class="subtitle text-muted">Join BidMart to shop at fixed prices or participate in verified live auctions.</p>

      <div class="form-error" id="form-error" role="alert"></div>

      <!-- Social Logins (Google, Apple) -->
      <div class="social-login-group">
        <button type="button" class="btn-social-auth btn-google" onclick="window.auth.loginWithSocial('google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
          <span>Sign up with Google</span>
        </button>
        <button type="button" class="btn-social-auth btn-apple" onclick="window.auth.loginWithSocial('apple')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.89c.66-.82 1.11-1.96.99-3.1-.97.04-2.15.65-2.83 1.46-.59.7-1.12 1.83-.98 2.94 1.08.08 2.16-.58 2.82-1.3z"/></svg>
          <span>Sign up with Apple</span>
        </button>
      </div>

      <div class="auth-divider-line">
        <span>or register with email</span>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full name *</label>
          <input type="text" id="name" name="name" placeholder="e.g. John Doe" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email address *</label>
          <input type="email" id="email" name="email" placeholder="john@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone number (optional)</label>
          <input type="tel" id="phone" name="phone" placeholder="9876543210" autocomplete="tel" />
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%;margin-top:8px;">Create Account</button>

        <!-- Continue as Guest Quick Button -->
        <a href="/shop/shop.html?guest=true" class="btn btn-guest-flow" style="display:block;width:100%;margin-top:10px;text-align:center;text-decoration:none;">
          <span>Explore as Guest →</span>
        </a>
      </form>

      <!-- Clear, distinct separation for Sellers -->
      <div style="margin-top:20px;padding:14px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;text-align:center;">
        <span style="font-size:0.85rem;color:#475569;display:block;margin-bottom:6px;">Looking to sell products or host auctions on BidMart?</span>
        <button type="button" id="btn-seller-auth-trigger" class="btn btn-mint btn-sm" style="font-weight:700;border:none;cursor:pointer;">
          <span>Become a BidMart Seller →</span>
        </button>
      </div>

      <p class="auth-switch" style="margin-top:16px;">
        Already have an account? <a href="/auth/login.html">Log in</a>
      </p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>
  <script src="/shared/explore-dialog.js"></script>
  <script src="/shared/explore-dialog.js"></script>

  <script>
    // If URL is explicitly for seller (?role=SELLER or ?type=seller), open seller modal
    const urlParams = new URLSearchParams(window.location.search);
    const roleParam = (urlParams.get('role') || urlParams.get('type') || '').toUpperCase();

    if (roleParam === 'SELLER') {
      window.addEventListener('DOMContentLoaded', () => {
        if (window.sellerAuth) {
          window.sellerAuth.open('signup');
        }
      });
    }

    // If already logged in, redirect to appropriate dashboard
    if (window.auth.isLoggedIn()) {
      window.auth.redirectToDashboard();
    }

    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');
    const sellerTrigger = document.getElementById('btn-seller-auth-trigger');

    if (sellerTrigger) {
      sellerTrigger.addEventListener('click', () => {
        if (window.sellerAuth) {
          window.sellerAuth.open('signup');
        }
      });
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function hideError() {
      errorBox.classList.remove('visible');
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideError();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!name || name.length < 2) {
        showError('Please enter your full name (minimum 2 characters).');
        return;
      }

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }

      if (password.length < 8) {
        showError('Password must be at least 8 characters long.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        // Strict role = BUYER for normal registration flow
        await window.auth.register({ name, email, password, phone, role: 'BUYER' });
        window.auth.redirectToDashboard();
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>

</body>
</html>
