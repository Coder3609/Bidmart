<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bids — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="dashboard-shell">
    <div class="container">
      <div class="bm-page-header-wrap" style="margin-bottom: 20px;">
        <a href="/dashboards/buyer/dashboard.html" class="bm-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/dashboards/buyer/dashboard.html'); return false;" aria-label="Go back to buyer dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Back to Dashboard</span>
        </a>
        <div class="bm-breadcrumbs">
          <a href="/">Home</a>
          <span class="bm-breadcrumbs-separator">/</span>
          <a href="/dashboards/buyer/dashboard.html">Buyer Dashboard</a>
          <span class="bm-breadcrumbs-separator">/</span>
          <span class="bm-breadcrumb-current">My Bids</span>
        </div>
      </div>

      <div class="page-head">
        <h1>My Bids</h1>
        <span class="text-muted">Every auction you've bid on, and where it stands.</span>
      </div>

      <div id="bids-container"><p class="text-muted">Loading your bids…</p></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>

  <script>
    window.auth.requireRole('BUYER');

    function statusInfo(row) {
      if (row.bid_status === 'WON') return { text: 'You won!', cls: 'status-auction_won' };
      if (row.bid_status === 'LOST') return { text: 'Lost', cls: 'status-auction_ended' };
      if (row.bid_status === 'OUTBID') return { text: 'Outbid', cls: 'status-out_of_stock' };
      if (row.bid_status === 'WINNING') return { text: 'Currently winning', cls: 'status-active_shop' };
      return { text: row.bid_status, cls: '' };
    }

    async function loadBids() {
      const container = document.getElementById('bids-container');
      try {
        const { items } = await window.api.get('/auctions/my-bids');

        if (items.length === 0) {
          container.innerHTML = '<div class="empty-state">You haven\'t bid on anything yet. <a href="/auction/auctions.html">Browse live auctions</a>.</div>';
          return;
        }

        container.innerHTML = `
          <table class="product-table">
            <thead><tr><th>Product</th><th>Your Bid</th><th>Current Price</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${items.map((row) => {
                const info = statusInfo(row);
                const showComplete = row.bid_status === 'WON' && row.product_status === 'AUCTION_WON';
                return `
                  <tr>
                    <td><a href="/auction/auction-detail.html?id=${row.auction_id}">${row.title}</a></td>
                    <td>₹${Number(row.amount).toLocaleString('en-IN')}</td>
                    <td>₹${Number(row.current_price).toLocaleString('en-IN')}</td>
                    <td><span class="status-pill ${info.cls}">${info.text}</span></td>
                    <td>${showComplete
                      ? `<a href="/auction/auction-detail.html?id=${row.auction_id}" class="btn btn-mint btn-sm">Complete Order</a>`
                      : ''}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } catch (err) {
        container.innerHTML = `<p class="text-muted">Could not load your bids: ${err.message}</p>`;
      }
    }

    loadBids();
  </script>

</body>
</html>
