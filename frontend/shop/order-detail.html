<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Details — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="container" style="max-width:900px;">
    <div class="bm-page-header-wrap" style="margin-bottom: 20px;">
      <a href="/shop/orders.html" class="bm-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/shop/orders.html'); return false;" aria-label="Go back to orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Orders</span>
      </a>
      <div class="bm-breadcrumbs">
        <a href="/">Home</a>
        <span class="bm-breadcrumbs-separator">/</span>
        <a href="/shop/orders.html">Orders</a>
        <span class="bm-breadcrumbs-separator">/</span>
        <span class="bm-breadcrumb-current">Order Details</span>
      </div>
    </div>
    <div class="page-head"><h1>Order Details</h1></div>
    <div class="form-error" id="form-error" role="alert"></div>
    <div id="order-root">
      <p class="text-muted">Loading order…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <!-- Write a Review modal -->
  <div class="modal-overlay" id="review-modal" hidden>
    <div class="modal">
      <button class="modal-close" id="review-modal-close" aria-label="Close">&times;</button>
      <h3 id="review-modal-title">Write a Review</h3>
      <form id="review-form" style="margin-top:14px;">
        <div class="form-group">
          <label for="review-rating">Rating</label>
          <select id="review-rating">
            <option value="5">★★★★★ (5) Excellent</option>
            <option value="4">★★★★☆ (4) Good</option>
            <option value="3">★★★☆☆ (3) Okay</option>
            <option value="2">★★☆☆☆ (2) Poor</option>
            <option value="1">★☆☆☆☆ (1) Terrible</option>
          </select>
        </div>
        <div class="form-group">
          <label for="review-comment">Comment (optional)</label>
          <textarea id="review-comment" rows="4" style="width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--color-border);font-family:inherit;"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Submit Review</button>
      </form>
    </div>
  </div>

  <!-- Request Return modal -->
  <div class="modal-overlay" id="return-modal" hidden>
    <div class="modal">
      <button class="modal-close" id="return-modal-close" aria-label="Close">&times;</button>
      <h3 id="return-modal-title">Request Return</h3>
      <form id="return-form" style="margin-top:14px;">
        <div class="form-group">
          <label for="return-reason">Reason for return</label>
          <textarea id="return-reason" rows="4" style="width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--color-border);font-family:inherit;" placeholder="e.g. Item arrived damaged"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Submit Return Request</button>
      </form>
    </div>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/product-card.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>

  <script>
    if (!window.auth.isLoggedIn()) {
      window.location.href = '/auth/login.html';
    }

    const errorBox = document.getElementById('form-error');
    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function hideError() { errorBox.classList.remove('visible'); }

    function statusLabel(status) {
      return status.replaceAll('_', ' ').replace(/\w\S*/g, (w) => w.charAt(0) + w.slice(1).toLowerCase());
    }

    const orderId = new URLSearchParams(window.location.search).get('id');

    async function loadOrder() {
      const root = document.getElementById('order-root');
      try {
        const [order, transitions] = await Promise.all([
          window.api.get(`/orders/${orderId}`),
          window.api.get(`/orders/${orderId}/transitions`),
        ]);

        const deliveredEver = order.statusHistory.some((h) => h.to_status === 'DELIVERED');
        const [myReviews, myReturns] = deliveredEver && window.auth.hasRole('BUYER')
          ? await Promise.all([
              window.api.get('/reviews/mine?limit=100').catch(() => ({ items: [] })),
              window.api.get('/returns/mine?limit=100').catch(() => ({ items: [] })),
            ])
          : [{ items: [] }, { items: [] }];
        const reviewedItemIds = new Set(myReviews.items.map((r) => r.order_item_id));
        const returnByItemId = new Map(myReturns.items.map((r) => [r.order_item_id, r]));

        const itemsHtml = order.items.map((item) => {
          const image = window.shopHelpers.firstImage(item);
          const activeReturn = returnByItemId.get(item.id);
          let itemAction = '';
          if (deliveredEver && window.auth.hasRole('BUYER')) {
            if (reviewedItemIds.has(item.id)) {
              itemAction += `<span class="text-muted" style="font-size:var(--font-size-xs);">★ Reviewed</span>`;
            } else {
              itemAction += `<button class="btn btn-ghost btn-sm" data-review-item="${item.id}" data-title="${item.title}">Write a Review</button>`;
            }
            if (activeReturn && activeReturn.status !== 'REJECTED' && activeReturn.status !== 'REFUNDED') {
              itemAction += ` <span class="text-muted" style="font-size:var(--font-size-xs);">Return: ${activeReturn.status.replace('_',' ')}</span>`;
            } else if (order.status === 'DELIVERED') {
              itemAction += ` <button class="btn btn-ghost btn-sm" data-return-item="${item.id}" data-title="${item.title}">Request Return</button>`;
            }
          }
          return `
            <div class="cart-line">
              <div class="cart-line__thumb">${image ? `<img src="${image}" style="width:100%;height:100%;object-fit:cover;" />` : ''}</div>
              <div>
                <div class="cart-line__title">${item.title}</div>
                <div class="text-muted" style="font-size:var(--font-size-xs);">Qty ${item.quantity} × ${window.shopHelpers.formatINR(item.unit_price)}</div>
                ${itemAction ? `<div style="margin-top:8px;">${itemAction}</div>` : ''}
              </div>
              <div></div>
              <div style="font-weight:700;text-align:right;">${window.shopHelpers.formatINR(item.line_total)}</div>
            </div>
          `;
        }).join('');

        const timelineHtml = order.statusHistory.map((h) => `
          <li>
            <div>
              <strong>${statusLabel(h.to_status)}</strong>
              <div class="text-muted" style="font-size:var(--font-size-xs);">${new Date(h.created_at).toLocaleString()}${h.note ? ' · ' + h.note : ''}</div>
            </div>
          </li>
        `).join('');

        const actionButtons = transitions.map((t) => `
          <button class="btn btn-ghost" data-to="${t.to}">${t.label}</button>
        `).join('');

        root.innerHTML = `
          <div class="order-card__head" style="margin-bottom:20px;">
            <div>
              <strong>Order #${order.id}</strong>
              <span class="text-muted" style="font-size:var(--font-size-xs);"> · placed ${new Date(order.placed_at).toLocaleString()}</span>
            </div>
            <span class="status-pill status-${order.status.toLowerCase()}">${statusLabel(order.status)}</span>
          </div>

          <div class="two-col">
            <div>
              <div class="card" style="padding:20px;margin-bottom:16px;">
                <h4 style="margin-bottom:12px;">Items</h4>
                ${itemsHtml}
                <div class="summary-row total"><span>Total</span><span>${window.shopHelpers.formatINR(order.total)}</span></div>
              </div>

              <div class="card" style="padding:20px;margin-bottom:16px;">
                <h4 style="margin-bottom:8px;">Deliver to</h4>
                <p style="margin:0;">${order.full_name} — ${order.address_phone}<br/>
                <span class="text-muted">${order.line1}${order.line2 ? ', ' + order.line2 : ''}, ${order.city}, ${order.state} ${order.postal_code}</span></p>
              </div>

              ${actionButtons ? `
                <div class="card" style="padding:20px;">
                  <h4 style="margin-bottom:12px;">Actions</h4>
                  <div class="row-actions">${actionButtons}</div>
                </div>
              ` : ''}
            </div>

            <div class="card" style="padding:20px;">
              <h4 style="margin-bottom:14px;">Status Timeline</h4>
              <ul class="status-timeline">${timelineHtml}</ul>
            </div>
          </div>
        `;

        root.querySelectorAll('[data-to]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            hideError();
            btn.disabled = true;
            try {
              await window.api.patch(`/orders/${orderId}/status`, { status: btn.dataset.to });
              await loadOrder();
            } catch (err) {
              showError(err.message);
              btn.disabled = false;
            }
          });
        });

        root.querySelectorAll('[data-review-item]').forEach((btn) => {
          btn.addEventListener('click', () => openReviewModal(btn.dataset.reviewItem, btn.dataset.title));
        });
        root.querySelectorAll('[data-return-item]').forEach((btn) => {
          btn.addEventListener('click', () => openReturnModal(btn.dataset.returnItem, btn.dataset.title));
        });
      } catch (err) {
        root.innerHTML = `<p class="text-muted">${err.message}</p>`;
      }
    }

    // ---------- Write a Review modal ----------
    const reviewModal = document.getElementById('review-modal');
    let reviewItemId = null;

    function openReviewModal(itemId, title) {
      reviewItemId = itemId;
      document.getElementById('review-modal-title').textContent = `Review: ${title}`;
      document.getElementById('review-rating').value = '5';
      document.getElementById('review-comment').value = '';
      reviewModal.hidden = false;
    }
    document.getElementById('review-modal-close').addEventListener('click', () => { reviewModal.hidden = true; });

    document.getElementById('review-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      hideError();
      try {
        await window.api.post('/reviews', {
          orderItemId: Number(reviewItemId),
          rating: Number(document.getElementById('review-rating').value),
          comment: document.getElementById('review-comment').value.trim() || undefined,
        });
        reviewModal.hidden = true;
        await loadOrder();
      } catch (err) {
        showError(err.message);
      }
    });

    // ---------- Request Return modal ----------
    const returnModal = document.getElementById('return-modal');
    let returnItemId = null;

    function openReturnModal(itemId, title) {
      returnItemId = itemId;
      document.getElementById('return-modal-title').textContent = `Request Return: ${title}`;
      document.getElementById('return-reason').value = '';
      returnModal.hidden = false;
    }
    document.getElementById('return-modal-close').addEventListener('click', () => { returnModal.hidden = true; });

    document.getElementById('return-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      hideError();
      const reason = document.getElementById('return-reason').value.trim();
      if (!reason) { showError('Please enter a reason for the return.'); return; }
      try {
        await window.api.post('/returns', { orderItemId: Number(returnItemId), reason });
        returnModal.hidden = true;
        await loadOrder();
      } catch (err) {
        showError(err.message);
      }
    });

    loadOrder();
  </script>

</body>
</html>
