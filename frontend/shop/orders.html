<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body>

  <div id="site-header"></div>

  <main class="container">
    <div class="bm-page-header-wrap" style="margin-bottom: 20px;">
      <a href="/dashboards/buyer/dashboard.html" class="bm-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/dashboards/buyer/dashboard.html'); return false;" aria-label="Go back to buyer dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Dashboard</span>
      </a>
      <div class="bm-breadcrumbs">
        <a href="/">Home</a>
        <span class="bm-breadcrumbs-separator">/</span>
        <a href="/dashboards/buyer/dashboard.html">Buyer Dashboard</a>
        <span class="bm-breadcrumbs-separator">/</span>
        <span class="bm-breadcrumb-current">My Orders</span>
      </div>
    </div>
    <div class="page-head"><h1>My Orders</h1></div>
    <div id="orders-list">
      <p class="text-muted">Loading your orders…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/product-card.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>

  <script>
    if (!window.auth.isLoggedIn()) {
      window.location.href = '/auth/login.html';
    }

    function statusLabel(status) {
      return status.replaceAll('_', ' ').replace(/\w\S*/g, (w) => w.charAt(0) + w.slice(1).toLowerCase());
    }

    (async () => {
      const container = document.getElementById('orders-list');
      try {
        const { items } = await window.api.get('/orders/my');

        if (items.length === 0) {
          container.innerHTML = '<div class="card empty-state">You haven\'t placed any orders yet. <a href="/shop/shop.html" style="color:var(--color-primary);font-weight:600;">Start shopping</a></div>';
          return;
        }

        container.innerHTML = items.map((o) => `
          <a href="/shop/order-detail.html?id=${o.id}" class="card order-card" style="display:block;">
            <div class="order-card__head">
              <div>
                <strong>Order #${o.id}</strong>
                <span class="text-muted" style="font-size:var(--font-size-xs);"> · placed ${new Date(o.placed_at).toLocaleDateString()}</span>
              </div>
              <span class="status-pill status-${o.status.toLowerCase()}">${statusLabel(o.status)}</span>
            </div>
            <div class="text-muted" style="font-size:var(--font-size-sm);">${o.source === 'AUCTION' ? 'Auction win' : 'Shop order'} · Total ${window.shopHelpers.formatINR(o.total)}</div>
          </a>
        `).join('');
      } catch (err) {
        container.innerHTML = `<p class="text-muted">Could not load your orders: ${err.message}</p>`;
      }
    })();
  </script>

</body>
</html>
