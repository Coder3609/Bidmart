<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/navbar-obsidian.css" />
  <link rel="stylesheet" href="/shared/explore-dialog.css" />
  <link rel="stylesheet" href="/shared/checkout-modal.css" />
  <link rel="stylesheet" href="/shop/cart-modern.css" />
</head>
<body class="bm-cart-body">

  <div id="site-header"></div>

  <main class="bm-cart-container">
    
    <!-- Top Nav / Back Link -->
    <div class="bm-cart-top-nav">
      <a href="/shop/shop.html" class="bm-cart-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/shop/shop.html'); return false;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Continue Shopping</span>
      </a>
      <div style="font-size:0.85rem;color:var(--bm-cart-muted);">
        <span>100% Escrow Protected Transactions</span>
      </div>
    </div>

    <!-- Title Row -->
    <div class="bm-cart-title-row">
      <h1 class="bm-cart-title">Your Shopping Cart</h1>
      <span class="bm-cart-item-count" id="bmCartHeaderCount">(0 items)</span>
    </div>

    <!-- Dynamic Layout -->
    <div class="bm-cart-grid" id="bmCartGrid">
      <div class="bm-cart-empty-stage">
        <p style="color:var(--bm-cart-muted);">Loading your cart items…</p>
      </div>
    </div>

  </main>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/checkout-modal.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/explore-dialog.js"></script>

  <script>
    function getStoredCart() {
      try {
        return JSON.parse(localStorage.getItem('bidmart_guest_cart') || '[]');
      } catch (_) {
        return [];
      }
    }

    function saveStoredCart(items) {
      localStorage.setItem('bidmart_guest_cart', JSON.stringify(items));
      renderCartView();
      // Sync navbar counter badge
      const total = items.reduce((sum, i) => sum + (Number(i.quantity) || 1), 0);
      document.querySelectorAll('#header-cart-badge').forEach(b => {
        b.textContent = total;
        b.hidden = total === 0;
      });
    }

    function formatINR(val) {
      return '₹' + Number(val || 0).toLocaleString('en-IN');
    }

    function renderCartView() {
      const items = getStoredCart();
      const grid = document.getElementById('bmCartGrid');
      const headerCount = document.getElementById('bmCartHeaderCount');

      const totalQuantity = items.reduce((sum, i) => sum + (Number(i.quantity) || 1), 0);
      headerCount.textContent = `(${totalQuantity} item${totalQuantity === 1 ? '' : 's'})`;

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="bm-cart-empty-stage">
            <div class="bm-cart-empty-icon">🛒</div>
            <h2 class="bm-cart-empty-heading">Your Cart is Currently Empty</h2>
            <p class="bm-cart-empty-sub">Explore our curated catalog or live auction drops to discover authentic electronics, timepieces, and lifestyle essentials.</p>
            <a href="/shop/shop.html" class="bm-btn-checkout-now" style="width:fit-content;padding:12px 32px;margin:0 auto;display:inline-flex;">
              Explore Catalog Drops &rarr;
            </a>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      const rowsHtml = items.map((item, idx) => {
        const price = Number(item.price) || 0;
        const qty = Number(item.quantity) || 1;
        const lineTotal = price * qty;
        subtotal += lineTotal;

        return `
          <div class="bm-cart-row">
            <div class="bm-cart-row-thumb">
              <img src="${item.img || item.image || '/assets/products/placeholder.svg'}" alt="${item.title}" onerror="this.src='/assets/products/placeholder.svg';" />
            </div>
            
            <div class="bm-cart-row-info">
              <h3 class="bm-cart-row-title">${item.title}</h3>
              <div class="bm-cart-row-unit-price">${formatINR(price)} per unit</div>
              
              <div class="bm-cart-qty-wrap">
                <div class="bm-cart-stepper">
                  <button type="button" onclick="updateItemQuantity(${idx}, -1)" aria-label="Decrease quantity">−</button>
                  <span>${qty}</span>
                  <button type="button" onclick="updateItemQuantity(${idx}, 1)" aria-label="Increase quantity">+</button>
                </div>
                <button type="button" class="bm-cart-btn-del" onclick="removeItem(${idx})">Remove</button>
              </div>
            </div>

            <div class="bm-cart-row-total">
              ${formatINR(lineTotal)}
            </div>
          </div>
        `;
      }).join('');

      grid.innerHTML = `
        <!-- Left: Cart Items List -->
        <div class="bm-cart-items-card">
          ${rowsHtml}
        </div>

        <!-- Right: Order Summary Card -->
        <div class="bm-cart-summary-card">
          <h2 class="bm-cart-summary-title">Order Summary</h2>
          
          <div class="bm-summary-line">
            <span>Subtotal (${totalQuantity} items)</span>
            <span style="font-weight:700;color:var(--bm-cart-text);">${formatINR(subtotal)}</span>
          </div>

          <div class="bm-summary-line highlight">
            <span>Express Delivery</span>
            <span>FREE</span>
          </div>

          <div class="bm-summary-line">
            <span>Escrow Protection Fee</span>
            <span>₹0 (Waived)</span>
          </div>

          <div class="bm-summary-divider"></div>

          <div class="bm-summary-total-row">
            <span class="bm-summary-total-label">Total Payable</span>
            <span class="bm-summary-total-val">${formatINR(subtotal)}</span>
          </div>

          <!-- Direct Link to Amazon-style Dedicated Checkout Page -->
          <a href="/shop/checkout.html" class="bm-btn-checkout-now">
            <span>Proceed to Buy</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </a>

          <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:0.75rem;color:var(--bm-cart-muted);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span>256-Bit SSL Encrypted & Escrow Backed</span>
          </div>
        </div>
      `;
    }

    function updateItemQuantity(idx, change) {
      const cart = getStoredCart();
      if (!cart[idx]) return;
      cart[idx].quantity = Math.max(1, (Number(cart[idx].quantity) || 1) + change);
      saveStoredCart(cart);
    }

    function removeItem(idx) {
      const cart = getStoredCart();
      cart.splice(idx, 1);
      saveStoredCart(cart);
    }

    window.updateItemQuantity = updateItemQuantity;
    window.removeItem = removeItem;

    document.addEventListener('DOMContentLoaded', renderCartView);
  </script>
</body>
</html>
