<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Center / Returns & Refunds — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body class="sc-app-body" style="background-color:var(--sc-bg);margin:0;">

  <div id="seller-header"></div>

  <div class="sc-app">
    <div id="seller-sidebar"></div>

    <main class="sc-main-content">
      <div class="bm-page-header-wrap">
        <div class="bm-page-header-top">
          <button type="button" class="bm-back-btn" onclick="window.nav.goBackOrFallback('/dashboards/seller/dashboard.html')" aria-label="Go back to Seller Dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back to Seller Dashboard</span>
          </button>
          <nav class="bm-breadcrumbs" aria-label="Breadcrumb">
            <a href="/dashboards/seller/dashboard.html" class="bm-breadcrumb-item">Seller Center</a>
            <span class="bm-breadcrumb-sep">/</span>
            <span class="bm-breadcrumb-item active" aria-current="page">Returns & Refunds</span>
          </nav>
        </div>
        <div class="bm-page-header-main">
          <div class="bm-page-header-titles">
            <h1 class="bm-page-title">Returns & Refunds</h1>
            <p class="bm-page-subtitle">Manage customer return requests and inspect returned merchandise.</p>
          </div>
        </div>
      </div>

      <div class="form-error" id="form-error" role="alert" style="margin-bottom:16px;"></div>

      <!-- Status Tabs Toolbar -->
      <div class="sc-card" style="padding:14px 20px;margin-bottom:20px;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;" id="status-tabs">
          <button type="button" class="sc-btn-sm" data-status="" style="background:#106EBE;color:#FFF;border-color:#106EBE;">All Requests</button>
          <button type="button" class="sc-btn-sm" data-status="REQUESTED">Pending Action</button>
          <button type="button" class="sc-btn-sm" data-status="APPROVED">Approved (Awaiting Return)</button>
          <button type="button" class="sc-btn-sm" data-status="PICKED_UP">Picked Up</button>
          <button type="button" class="sc-btn-sm" data-status="REJECTED">Rejected</button>
          <button type="button" class="sc-btn-sm" data-status="REFUNDED">Refunded</button>
        </div>
      </div>

      <!-- Returns Table Card -->
      <div class="sc-card" style="padding:0;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table class="sc-table">
            <thead>
              <tr>
                <th style="padding-left:20px;">Return #</th>
                <th>Product</th>
                <th>Buyer</th>
                <th>Reason</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="returns-tbody">
              <tr><td colspan="7" class="text-muted" style="text-align:center;padding:32px;">Loading return requests…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/seller-header.js"></script>
  <script src="/shared/seller-sidebar.js"></script>

  <script>
    window.auth.requireRole('SELLER');

    let currentStatus = '';
    const errorBox = document.getElementById('form-error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }
    function hideError() { errorBox.classList.remove('visible'); }

    async function loadReturns() {
      const tbody = document.getElementById('returns-tbody');
      tbody.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center;padding:32px;">Loading return requests…</td></tr>';
      hideError();

      try {
        const qs = currentStatus ? `?status=${currentStatus}` : '';
        const { items } = await window.api.get(`/returns/seller${qs}`);

        if (!items || items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-muted" style="text-align:center;padding:48px 20px;">No return requests matching this filter.</td></tr>';
          return;
        }

        tbody.innerHTML = items.map(r => {
          const fallbackImg = '/assets/placeholder-product.svg';
          let imgUrl = fallbackImg;
          if (Array.isArray(r.images) && r.images.length) imgUrl = r.images[0];
          else if (typeof r.images === 'string') {
            try { const arr = JSON.parse(r.images); imgUrl = arr[0] || fallbackImg; } catch {}
          }

          const statusClass = (r.status || '').toLowerCase();
          const dateStr = new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

          let actionButtons = '';
          if (r.status === 'REQUESTED') {
            actionButtons = `
              <button class="sc-btn-sm" style="color:#059669;border-color:#059669;" data-action="approve" data-id="${r.id}">Approve</button>
              <button class="sc-btn-sm" style="color:#DC2626;border-color:#DC2626;" data-action="reject" data-id="${r.id}">Reject</button>
            `;
          } else if (r.status === 'APPROVED') {
            actionButtons = `
              <button class="sc-btn-sm" style="color:var(--sc-primary);border-color:var(--sc-primary);" data-action="picked-up" data-id="${r.id}">Confirm Picked Up</button>
            `;
          } else {
            actionButtons = `<span class="text-muted" style="font-size:0.75rem;">Resolved</span>`;
          }

          return `
            <tr>
              <td style="padding-left:20px;"><strong>#RET-${r.id}</strong></td>
              <td>
                <div class="sc-product-cell">
                  <img src="${imgUrl}" alt="${r.title}" class="sc-thumb-sm" onerror="this.src='${fallbackImg}'" />
                  <div>
                    <div style="font-weight:700;">${r.title}</div>
                    <div class="text-muted" style="font-size:0.75rem;">Order #BM${r.order_id}</div>
                  </div>
                </div>
              </td>
              <td>${r.buyer_name || 'Buyer'}</td>
              <td><span style="font-size:0.8rem;color:#475569;">${r.reason}</span></td>
              <td><span class="sc-status-pill ${statusClass}">${r.status.replace('_', ' ')}</span></td>
              <td><span class="text-muted" style="font-size:0.8rem;">${dateStr}</span></td>
              <td><div style="display:flex;gap:6px;">${actionButtons}</div></td>
            </tr>
          `;
        }).join('');

        // Action Handlers
        tbody.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            btn.disabled = true;

            try {
              if (action === 'approve') {
                await window.api.patch(`/returns/${id}/respond`, { decision: 'APPROVE' });
              } else if (action === 'reject') {
                await window.api.patch(`/returns/${id}/respond`, { decision: 'REJECT' });
              } else if (action === 'picked-up') {
                await window.api.patch(`/returns/${id}/picked-up`, {});
              }
              await loadReturns();
            } catch (err) {
              showError(err.message);
              btn.disabled = false;
            }
          });
        });

      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" style="color:#EF4444;text-align:center;padding:24px;">Could not load returns: ${err.message}</td></tr>`;
      }
    }

    document.querySelectorAll('#status-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#status-tabs button').forEach(b => {
          b.style.background = '#FFFFFF';
          b.style.color = 'var(--sc-text-main)';
          b.style.borderColor = '#CBD5E1';
        });
        btn.style.background = '#106EBE';
        btn.style.color = '#FFFFFF';
        btn.style.borderColor = '#106EBE';
        currentStatus = btn.dataset.status;
        loadReturns();
      });
    });

    loadReturns();
  </script>
</body>
</html>
