<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auction Watchlist — BidMart Auction Center</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/auth-modal.css" />
</head>
<body class="sc-app-body auc-app-body" style="background-color:var(--sc-bg);margin:0;">

  <!-- Global Header -->
  <div id="seller-header"></div>

  <div class="sc-app">
    <!-- Persistent Left Navigation Sidebar -->
    <div id="auction-sidebar"></div>

    <!-- Main Content Area -->
    <main class="sc-main-content">
      
      <div class="bm-page-header-wrap" style="margin-bottom: 20px;">
        <div class="bm-breadcrumbs" style="margin-bottom: 8px;">
          <a href="/index.html" class="bm-breadcrumb-item">Auction Center</a>
          <span class="bm-breadcrumb-sep">/</span>
          <span class="bm-breadcrumb-item active">Watchlist</span>
        </div>
        <div>
          <a href="/auction/auctions.html" class="bm-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/auction/auctions.html'); return false;" aria-label="Go back to live auctions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <span>Back to Auctions</span>
          </a>
        </div>
      </div>

      <!-- Top Page Header -->
      <div class="sc-page-header">
        <div>
          <h1 class="sc-title">Auction Watchlist</h1>
          <p class="sc-subtitle">Monitor your bookmarked auctions with real-time countdowns and quick bidding.</p>
        </div>
        <div class="sc-header-actions">
          <a href="/auction/auctions.html" class="sc-btn-primary" style="text-decoration:none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M14 4l6 6M4 14l6 6M2 22l6-6M9 9l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14 16l4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            <span>Browse All Auctions</span>
          </a>
        </div>
      </div>

      <!-- Watchlist Grid -->
      <div class="auc-cards-grid" id="watchlist-grid">
        <p class="text-muted" style="grid-column:1/-1;text-align:center;padding:40px;">Loading your watched auctions…</p>
      </div>

    </main>
  </div>

  <!-- Toast Container -->
  <div class="bm-toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/auth-modal.js"></script>
  <script src="/shared/auction-card.js"></script>
  <script src="/shared/seller-header.js"></script>
  <script src="/shared/auction-sidebar.js"></script>

  <script>
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `bm-toast ${type}`;
      toast.innerHTML = `
        <span>${type === 'success' ? '✓' : (type === 'error' ? '✘' : 'ℹ')}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    async function loadWatchlist() {
      const grid = document.getElementById('watchlist-grid');
      const user = window.auth ? window.auth.getUser() : null;

      if (!user) {
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;padding:60px 20px;background:#FFFFFF;border-radius:14px;border:1px solid #E2E8F0;">
            <div style="font-size:2.5rem;margin-bottom:12px;">🔒</div>
            <h3 style="margin:0 0 8px;font-size:1.15rem;color:#0F172A;font-weight:700;">Bidder Authentication Required</h3>
            <p class="text-muted" style="font-size:0.88rem;max-width:400px;margin:0 auto 18px;">
              Sign in to view your saved auctions, track lot closing times, and place bids.
            </p>
            <button type="button" class="sc-btn-primary" id="btn-watchlist-login" style="display:inline-flex;margin:0 auto;">
              <span>👤 Bidder Login / Sign Up</span>
            </button>
          </div>
        `;
        document.getElementById('btn-watchlist-login')?.addEventListener('click', () => {
          window.buyerAuth?.open('login', {
            message: 'Sign in to access your auction watchlist.',
            onSuccess: () => {
              loadWatchlist();
              renderAuctionSidebar();
            }
          });
        });
        return;
      }

      grid.innerHTML = '<p class="text-muted" style="grid-column:1/-1;text-align:center;padding:40px;">Loading your watched auctions…</p>';

      try {
        const { items } = await window.api.get('/wishlist');
        const wishlistItems = items || [];

        if (wishlistItems.length === 0) {
          grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:60px 20px;background:#FFFFFF;border-radius:14px;border:1px solid #E2E8F0;">
              <div style="font-size:2.5rem;margin-bottom:12px;">❤️</div>
              <h3 style="margin:0 0 8px;font-size:1.15rem;color:#0F172A;">Your Watchlist is Empty</h3>
              <p class="text-muted" style="font-size:0.88rem;max-width:400px;margin:0 auto 18px;">
                Bookmark auctions by clicking the heart icon on any auction card to track closing timers and leading bids.
              </p>
              <a href="/auction/auctions.html" class="sc-btn-primary" style="display:inline-flex;margin:0 auto;text-decoration:none;">
                Explore Live Auctions
              </a>
            </div>
          `;
          return;
        }

        // Fetch auction info for each wishlisted product
        const auctionCards = [];
        for (const item of wishlistItems) {
          try {
            const auction = await window.api.get(`/auctions/by-product/${item.product_id}`);
            if (auction) {
              auctionCards.push(auction);
            }
          } catch (e) {
            // Product might not have an active auction
          }
        }

        if (auctionCards.length === 0) {
          grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;padding:60px 20px;background:#FFFFFF;border-radius:14px;border:1px solid #E2E8F0;">
              <div style="font-size:2.5rem;margin-bottom:12px;">🏷️</div>
              <h3 style="margin:0 0 8px;font-size:1.15rem;color:#0F172A;">No Active Auctions in Watchlist</h3>
              <p class="text-muted" style="font-size:0.88rem;max-width:400px;margin:0 auto 18px;">
                None of your wishlisted items currently have active auctions. Browse our marketplace to find live auctions.
              </p>
              <a href="/auction/auctions.html" class="sc-btn-primary" style="display:inline-flex;margin:0 auto;text-decoration:none;">
                Browse Live Auctions
              </a>
            </div>
          `;
          return;
        }

        grid.innerHTML = auctionCards.map(auc => {
          return window.auctionHelpers.renderModernAuctionCard(auc, { isWatchlisted: true, myBid: auc.myBid });
        }).join('');

        wireWatchlistButtons();
      } catch (err) {
        grid.innerHTML = `<p class="text-muted" style="grid-column:1/-1;text-align:center;padding:40px;">Could not load watchlist: ${err.message}</p>`;
      }
    }

    function wireWatchlistButtons() {
      // Remove from watchlist
      document.querySelectorAll('[data-action="toggle-watchlist"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const productId = btn.dataset.productId;
          try {
            await window.api.del(`/wishlist/${productId}`);
            showToast('Removed from Watchlist.', 'info');
            loadWatchlist();
          } catch (err) {
            showToast(err.message || 'Could not remove.', 'error');
          }
        });
      });

      // Quick Bids
      document.querySelectorAll('[data-action="quick-bid"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const user = window.auth ? window.auth.getUser() : null;
          if (!user) {
            window.buyerAuth?.open('login', {
              message: 'Sign in to place live bids.',
              onSuccess: () => loadWatchlist()
            });
            return;
          }

          const auctionId = btn.dataset.auctionId;
          const input = document.getElementById(`bid-input-${auctionId}`);
          if (!input) return;
          const amount = Number(input.value);

          try {
            btn.disabled = true;
            await window.api.post(`/auctions/${auctionId}/bids`, { amount });
            showToast(`Bid placed for ₹${amount.toLocaleString('en-IN')}!`, 'success');
            loadWatchlist();
          } catch (err) {
            if (err.code === 'KYC_REQUIRED' || err.code === 'KYC_PENDING' || err.code === 'KYC_REJECTED') {
              showToast(`${err.message} Opening KYC verification…`, 'error');
              setTimeout(() => {
                window.location.href = '/auction/kyc.html';
              }, 1400);
            } else {
              showToast(err.message || 'Bid failed.', 'error');
            }
            btn.disabled = false;
          }
        });
      });
    }

    // Initial Bootstrap
    renderSellerHeader();
    renderAuctionSidebar();
    loadWatchlist();

    // Live countdown ticker
    setInterval(() => {
      document.querySelectorAll('.auc-card-timer[data-timer-target]').forEach(timerEl => {
        const card = timerEl.closest('.auc-card');
        if (!card) return;
        const status = card.dataset.status;
        const endsAt = card.dataset.endsAt;
        const startsAt = card.dataset.startsAt;
        const info = window.auctionHelpers.getCountdownInfo({ status, starts_at: startsAt, ends_at: endsAt });
        timerEl.querySelector('span:first-child').textContent = `⏱ ${info.text}`;
        if (info.urgent) timerEl.classList.add('urgent');
      });
    }, 1000);
  </script>

</body>
</html>
