<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F9FC" />
      <stop offset="100%" stop-color="#EAEFF7" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#102A43" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <rect x="60" y="60" width="480" height="480" rx="24" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Category Badge -->
  <rect x="90" y="90" width="160" height="32" rx="16" fill="#0078D4" fill-opacity="0.12" />
  <text x="170" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0078D4" text-anchor="middle">OFFICE & STATIONERY</text>
  
  <!-- Central Product Graphic Base -->
  <circle cx="300" cy="270" r="110" fill="#0078D4" fill-opacity="0.08" stroke="#0078D4" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Icon representation -->
  <g transform="translate(240, 210) scale(5)" stroke="#0078D4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
  </g>
  
  <!-- Title / Product Info -->
  <text x="300" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#172033" text-anchor="middle">Luxor Executive Leatherette Not...</text>
  <text x="300" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">Official Verified Product · Hybrid Marketplace</text>
</svg>