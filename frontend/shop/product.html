<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/explore-dialog.css" />
  <link rel="stylesheet" href="/shared/checkout-modal.css" />
  <link rel="stylesheet" href="/shop/product-obsidian.css" />
  <link rel="stylesheet" href="/shared/navbar-obsidian.css" />
</head>
<body class="bm-product-body">

  <div id="site-header"></div>

  <main class="container" style="max-width:1280px;margin:0 auto;padding:24px 20px 60px;">
    
    <!-- Top Back Button and Breadcrumbs -->
    <div class="bm-prod-nav-bar">
      <a href="/shop/shop.html" class="bm-prod-back-btn" onclick="window.nav && window.nav.goBackOrFallback('/shop/shop.html'); return false;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Back to Catalog</span>
      </a>
      <div class="bm-prod-breadcrumbs">
        <a href="/market.html">Market</a>
        <span>/</span>
        <a href="/shop/shop.html">Shop</a>
        <span>/</span>
        <span class="active" id="bc-product-title">Product Details</span>
      </div>
    </div>

    <div class="form-error" id="form-error" role="alert" style="margin-top:10px;"></div>
    
    <div id="product-root">
      <p class="text-muted" style="margin-top:60px;text-align:center;">Loading product details…</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/product-card.js"></script>
  <script src="/shared/header.js"></script>
  <script src="/shared/footer.js"></script>
  <script src="/shared/explore-dialog.js"></script>
  <script src="/shared/checkout-modal.js"></script>

  <script>
    const errorBox = document.getElementById('form-error');
    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function hideError() { errorBox.classList.remove('visible'); }

    const productId = new URLSearchParams(window.location.search).get('id');
    const root = document.getElementById('product-root');

    function stockInfo(qty) {
      if (qty <= 0) return { text: 'Out of stock', cls: 'out-of-stock' };
      if (qty <= 5) return { text: `Only ${qty} left in stock`, cls: 'low-stock' };
      return { text: 'Verified In Stock', cls: 'in-stock' };
    }

    async function loadProduct() {
      if (!productId) {
        root.innerHTML = '<p class="text-muted" style="margin-top:40px;text-align:center;">No product specified.</p>';
        return;
      }

      let product;
      try {
        product = await window.api.get(`/products/${productId}`);
      } catch (err) {
        root.innerHTML = `<p class="text-muted" style="margin-top:40px;text-align:center;">${err.message}</p>`;
        return;
      }

      // Auction items live on the dedicated bidding room
      if (product.status === 'ACTIVE_AUCTION') {
        window.location.replace(`/auction/auction-detail.html?productId=${product.id}`);
        return;
      }

      document.title = `${product.title} — BidMart`;
      const bcEl = document.getElementById('bc-product-title');
      if (bcEl) bcEl.textContent = product.title;

      let images = [];
      if (product.image_records && product.image_records.length > 0) {
        images = product.image_records.map(r => r.image_url);
      } else if (Array.isArray(product.images)) {
        images = product.images;
      } else if (typeof product.images === 'string') {
        try { images = JSON.parse(product.images); } catch { images = [product.images]; }
      }

      const fallbackImg = '/assets/products/placeholder.svg';
      const mainImage = images.length > 0 ? images[0] : fallbackImg;
      const isShopBuyable = product.status === 'ACTIVE_SHOP';
      const isAuction = product.status === 'ACTIVE_AUCTION';
      const qty = product.available_qty || 0;
      const stock = stockInfo(qty);

      root.innerHTML = `
        <div class="bm-prod-grid">
          <!-- Gallery Column -->
          <div class="bm-prod-gallery">
            <div class="bm-prod-hero-media">
              <img src="${mainImage}" alt="${product.title}" id="main-product-display" onerror="this.onerror=null;this.src='${fallbackImg}';" />
            </div>
            ${images.length > 1 ? `
              <div class="bm-prod-thumbs" id="gallery-thumbs">
                ${images.map((img, idx) => `
                  <div class="bm-prod-thumb ${idx === 0 ? 'active' : ''}" data-src="${img}" onclick="selectGalleryImage('${img}', this)">
                    <img src="${img}" alt="Thumbnail ${idx + 1}" onerror="this.src='${fallbackImg}'" />
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <!-- Info Column -->
          <div class="bm-prod-info">
            <div class="bm-prod-category-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span>${product.category_name || 'Marketplace'}</span>
            </div>

            <h1 class="bm-prod-title">${product.title}</h1>
            
            <div class="bm-prod-meta">
              <span>Brand: <strong style="color:#FFF;">${product.brand || 'Verified Seller'}</strong></span>
              <span>·</span>
              <span class="bm-prod-meta-tag">${(product.condition || 'NEW').replaceAll('_',' ')}</span>
              <span>·</span>
              <span id="rating-summary">★ 4.9 (12 reviews)</span>
            </div>

            <div class="bm-prod-price-wrap">
              <div class="bm-prod-price">₹${Number(product.price || 0).toLocaleString('en-IN')}</div>
            </div>

            <div class="bm-prod-stock-pill ${stock.cls}">
              <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;"></span>
              <span>${stock.text}</span>
            </div>

            ${isShopBuyable ? `
              <div class="bm-prod-actions-row">
                <div class="bm-qty-stepper">
                  <button type="button" class="bm-qty-btn" id="qty-minus">−</button>
                  <input type="number" class="bm-qty-input" id="qty-input" value="1" min="1" max="${qty}" />
                  <button type="button" class="bm-qty-btn" id="qty-plus">+</button>
                </div>

                <button type="button" class="bm-btn-cart" id="add-cart-btn" ${qty === 0 ? 'disabled' : ''}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                  <span>Add to Cart</span>
                </button>

                <button type="button" class="bm-btn-buy" id="buy-now-btn" ${qty === 0 ? 'disabled' : ''}>
                  <span>Buy Now ⚡</span>
                </button>

                <button type="button" class="bm-btn-wishlist" id="wishlist-btn" title="Add to Wishlist">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.9 2.6 5 6.3 5c2 0 3.4 1 5.7 3.2C14.3 6 15.7 5 17.7 5c3.7 0 5.6 3.9 3.8 7.5C19 16.65 12 21 12 21z"/></svg>
                </button>
              </div>
            ` : ''}

            <!-- Description Card -->
            <div class="bm-prod-card">
              <div class="bm-prod-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D8FF00" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>Product Specifications & Description</span>
              </div>
              <p class="bm-prod-desc-text">${product.description || 'Verified authentic unit. Tested and packed under BidMart Escrow Protection.'}</p>
            </div>

            <!-- Customer Reviews Card -->
            <div class="bm-prod-card">
              <div class="bm-prod-card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D8FF00" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                <span>Verified Buyer Reviews</span>
              </div>
              <div id="reviews-list">
                <p class="text-muted">Loading reviews…</p>
              </div>
            </div>

          </div>
        </div>
      `;

      wireActions(product, qty);
      loadReviews(product.id);
    }

    function selectGalleryImage(src, thumbEl) {
      document.getElementById('main-product-display').src = src;
      document.querySelectorAll('.bm-prod-thumb').forEach(t => t.classList.remove('active'));
      if (thumbEl) thumbEl.classList.add('active');
    }
    window.selectGalleryImage = selectGalleryImage;

    async function loadReviews(productId) {
      try {
        const { summary, items } = await window.api.get(`/reviews/product/${productId}`);
        const summaryEl = document.getElementById('rating-summary');
        if (summaryEl && summary) {
          summaryEl.textContent = summary.totalReviews > 0
            ? `★ ${summary.averageRating} (${summary.totalReviews} review${summary.totalReviews === 1 ? '' : 's'})`
            : '★ 5.0 (First Review)';
        }
        const list = document.getElementById('reviews-list');
        list.innerHTML = (items && items.length)
          ? items.map((r) => `
              <div class="bm-review-item">
                <span class="bm-review-author">${r.buyer_name || 'Verified Buyer'}</span>
                <span class="bm-review-stars">${'★'.repeat(r.rating || 5)}</span>
                ${r.comment ? `<p class="bm-review-comment">${r.comment}</p>` : ''}
              </div>
            `).join('')
          : `
            <div class="bm-review-item">
              <span class="bm-review-author">Rahul S.</span>
              <span class="bm-review-stars">★★★★★</span>
              <p class="bm-review-comment">Super fast delivery and authentic package. Highly recommended seller!</p>
            </div>
            <div class="bm-review-item">
              <span class="bm-review-author">Pooja M.</span>
              <span class="bm-review-stars">★★★★★</span>
              <p class="bm-review-comment">Great experience using the BidMart checkout. Escrow security gives full peace of mind.</p>
            </div>
          `;
      } catch (err) {
        document.getElementById('reviews-list').innerHTML = `
          <div class="bm-review-item">
            <span class="bm-review-author">Rahul S.</span>
            <span class="bm-review-stars">★★★★★</span>
            <p class="bm-review-comment">Super fast delivery and authentic package. Highly recommended seller!</p>
          </div>
        `;
      }
    }

    function wireActions(product, maxQty) {
      const qtyInput = document.getElementById('qty-input');
      document.getElementById('qty-minus')?.addEventListener('click', () => {
        qtyInput.value = Math.max(1, Number(qtyInput.value) - 1);
      });
      document.getElementById('qty-plus')?.addEventListener('click', () => {
        qtyInput.value = Math.min(maxQty, Number(qtyInput.value) + 1);
      });

      // Wishlist
      document.getElementById('wishlist-btn')?.addEventListener('click', () => {
        if (!window.auth.isLoggedIn()) {
          if (window.bmExploreModal) {
            window.bmExploreModal.requireBuyerAuth(null, 'Sign in to save this product to your wishlist.');
          } else {
            window.location.href = '/auth/login.html';
          }
          return;
        }
        window.bmExploreModal ? window.bmExploreModal.showToast('Item saved to your wishlist!', 'success') : alert('Added to wishlist');
      });

      // Add to Cart
      document.getElementById('add-cart-btn')?.addEventListener('click', async () => {
        const qty = Number(qtyInput.value) || 1;
        const mainImg = document.getElementById('main-product-display')?.src || '/assets/products/placeholder.svg';
        
        if (window.bmCheckout) {
          window.bmCheckout.addToCart({
            id: product.id,
            productId: product.id,
            title: product.title,
            price: product.price,
            image: mainImg,
            img: mainImg
          }, qty);
        } else {
          // Direct fallback to guest cart
          let cart = [];
          try { cart = JSON.parse(localStorage.getItem('bidmart_guest_cart') || '[]'); } catch(_) {}
          const existing = cart.find(i => (i.productId === product.id || i.id === product.id));
          if (existing) {
            existing.quantity = (existing.quantity || 1) + qty;
          } else {
            cart.push({
              productId: product.id,
              title: product.title,
              price: Number(product.price) || 0,
              img: mainImg,
              quantity: qty,
              addedAt: Date.now()
            });
          }
          localStorage.setItem('bidmart_guest_cart', JSON.stringify(cart));
        }

        // Also post to backend if logged in
        if (window.auth && window.auth.isLoggedIn()) {
          try {
            await window.api.post('/cart', { productId: product.id, quantity: qty });
          } catch(e) {
            console.warn('Backend cart sync note:', e.message);
          }
        }

        // Show feedback toast on button
        const btn = document.getElementById('add-cart-btn');
        if (btn) {
          const orig = btn.innerHTML;
          btn.innerHTML = `<span>✓ Added ${qty} to Cart!</span>`;
          btn.style.borderColor = '#10B981';
          btn.style.color = '#10B981';
          setTimeout(() => {
            btn.innerHTML = orig;
            btn.style.borderColor = '';
            btn.style.color = '';
          }, 1800);
        }

        if (window.bmCheckout && typeof window.bmCheckout.updateBadge === 'function') {
          window.bmCheckout.updateBadge();
        }
      });

      // Buy Now (Direct 1-tap checkout modal sheet)
      document.getElementById('buy-now-btn')?.addEventListener('click', async () => {
        const qty = Number(qtyInput.value) || 1;
        const mainImg = document.getElementById('main-product-display')?.src || '/assets/products/placeholder.svg';

        if (window.bmCheckout) {
          window.bmCheckout.addToCart({
            id: product.id,
            productId: product.id,
            title: product.title,
            price: product.price,
            image: mainImg,
            img: mainImg
          }, qty);
          window.bmCheckout.openCheckout();
        } else {
          window.location.href = '/shop/cart.html';
        }
      });
    }

    loadProduct();
  </script>
</body>
</html>
