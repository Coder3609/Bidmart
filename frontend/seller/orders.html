<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Center / Orders — BidMart</title>
  <link rel="stylesheet" href="/shared/theme.css" />
</head>
<body class="sc-app-body" style="background-color:var(--sc-bg);margin:0;">

  <div id="seller-header"></div>

  <div class="sc-app">
    <div id="seller-sidebar"></div>

    <main class="sc-main-content">
      <div class="bm-page-header-wrap">
        <div class="bm-page-header-top">
          <button type="button" class="bm-back-btn" onclick="window.nav.goBackOrFallback('/dashboards/seller/dashboard.html')" aria-label="Go back to Seller Dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back to Seller Dashboard</span>
          </button>
          <nav class="bm-breadcrumbs" aria-label="Breadcrumb">
            <a href="/dashboards/seller/dashboard.html" class="bm-breadcrumb-item">Seller Center</a>
            <span class="bm-breadcrumb-sep">/</span>
            <span class="bm-breadcrumb-item active" aria-current="page">Orders Management</span>
          </nav>
        </div>
        <div class="bm-page-header-main">
          <div class="bm-page-header-titles">
            <h1 class="bm-page-title">Orders Management</h1>
            <p class="bm-page-subtitle">View and fulfill incoming customer orders for your products.</p>
          </div>
        </div>
      </div>

      <div class="form-error" id="form-error" role="alert" style="margin-bottom:16px;"></div>

      <!-- Filters & Search Toolbar -->
      <div class="sc-card" style="padding:16px 20px;margin-bottom:20px;">
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;">
          <div style="display:flex;gap:12px;align-items:center;flex:1;min-width:280px;">
            <div class="sc-search-bar" style="max-width:320px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="sc-search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <input type="search" id="order-search-input" placeholder="Search by order ID, buyer, city..." />
            </div>
            <select class="sc-period-select" id="order-status-filter">
              <option value="">All Order Statuses</option>
              <option value="PENDING">Pending</option>
              <option value="PROCESSING">Processing</option>
              <option value="SHIPPED">Shipped</option>
              <option value="DELIVERED">Delivered</option>
              <option value="CANCELLED">Cancelled</option>
              <option value="RETURN_REQUESTED">Return Requested</option>
              <option value="REFUNDED">Refunded</option>
            </select>
          </div>
          <span class="text-muted" style="font-size:0.82rem;font-weight:600;" id="order-count-label">Loading orders…</span>
        </div>
      </div>

      <!-- Orders Table Card -->
      <div class="sc-card" style="padding:0;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table class="sc-table">
            <thead>
              <tr>
                <th style="padding-left:20px;">Order ID</th>
                <th>Buyer</th>
                <th>Destination</th>
                <th>Total Amount</th>
                <th>Status</th>
                <th>Order Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <tr><td colspan="7" class="text-muted" style="text-align:center;padding:32px;">Loading your sales…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="/shared/auth.js"></script>
  <script src="/shared/api.js"></script>
  <script src="/shared/navigation.js"></script>
  <script src="/shared/seller-header.js"></script>
  <script src="/shared/seller-sidebar.js"></script>

  <script>
    window.auth.requireRole('SELLER');

    let allOrders = [];
    const errorBox = document.getElementById('form-error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }
    function hideError() { errorBox.classList.remove('visible'); }

    function formatINR(num) {
      return '₹' + Number(num || 0).toLocaleString('en-IN');
    }

    async function loadOrders() {
      hideError();
      try {
        const { items } = await window.api.get('/orders/my-sales');
        allOrders = items || [];
        renderOrdersTable();
      } catch (err) {
        showError('Could not load orders: ' + err.message);
      }
    }

    function renderOrdersTable() {
      const tbody = document.getElementById('orders-tbody');
      const searchQ = document.getElementById('order-search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('order-status-filter').value;

      let filtered = allOrders.filter(o => {
        if (statusFilter && o.status !== statusFilter) return false;
        if (searchQ) {
          const matchId = String(o.id).includes(searchQ);
          const matchCity = (o.city || '').toLowerCase().includes(searchQ);
          const matchState = (o.state || '').toLowerCase().includes(searchQ);
          const matchName = (o.full_name || '').toLowerCase().includes(searchQ);
          if (!matchId && !matchCity && !matchState && !matchName) return false;
        }
        return true;
      });

      document.getElementById('order-count-label').textContent = `Showing ${filtered.length} of ${allOrders.length} orders`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align:center;padding:48px 20px;">
              <div style="font-size:1.1rem;font-weight:700;color:#172033;margin-bottom:6px;">No orders found</div>
              <p class="text-muted">Orders for your products will appear here once customers place checkouts.</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(o => {
        const statusClass = (o.status || '').toLowerCase();
        const dateStr = new Date(o.placed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const buyerName = o.full_name || 'Customer';
        const destination = o.city ? `${o.city}, ${o.state || ''}` : 'Standard Delivery';

        return `
          <tr>
            <td style="padding-left:20px;"><strong>#BM${o.id}</strong></td>
            <td>
              <div style="font-weight:700;color:#172033;">${buyerName}</div>
              <div class="text-muted" style="font-size:0.75rem;">Source: ${o.source || 'SHOP'}</div>
            </td>
            <td><span class="text-muted" style="font-weight:600;">${destination}</span></td>
            <td><strong>${formatINR(o.total)}</strong></td>
            <td><span class="sc-status-pill ${statusClass}">${o.status.replace('_', ' ')}</span></td>
            <td><span class="text-muted" style="font-size:0.8rem;">${dateStr}</span></td>
            <td>
              <a href="/shop/order-detail.html?id=${o.id}" class="sc-btn-sm" style="color:var(--sc-primary);">View Order</a>
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('order-search-input').addEventListener('input', renderOrdersTable);
    document.getElementById('order-status-filter').addEventListener('change', renderOrdersTable);

    loadOrders();
  </script>
</body>
</html>
